name: Verificação do projeto

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: TypeScript e build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependências
        run: bun install

      - name: Disponibilizar lockfile atualizado
        uses: actions/upload-artifact@v4
        with:
          name: bun-lock-${{ github.sha }}
          path: bun.lock
          retention-days: 1

      - name: Verificar tipos e gerar build
        run: bun run check
